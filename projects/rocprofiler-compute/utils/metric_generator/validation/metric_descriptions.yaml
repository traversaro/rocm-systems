  plain: Number of L2 cache - Infinity Fabric write requests (either 32-byte or 64-byte) summed over TCC instances per normalization
    unit.
  rst: Number of L2 cache - Infinity Fabric write requests (either 32-byte or 64-byte) summed over TCC instances per normalization
    unit.
  unit: ''
GWS:
  plain: Total number of GDS (global data sync) instructions issued per normalization unit.
  rst: Total number of GDS (global data sync) instructions issued per normalization unit.
  unit: ''
Global/Generic Atomic:
  plain: The total number of global & generic memory atomic (with and without return) instructions executed on all compute
    units on the accelerator, per normalization unit.
  rst: The total number of global & generic memory atomic (with and without return) instructions executed on all compute units
    on the accelerator, per normalization unit.
  unit: ''
Global/Generic Atomic Instructions:
  plain: The total number of global & generic memory atomic (with and without return) instructions executed on all compute
    units on the accelerator, per normalization unit.
  rst: The total number of global & generic memory atomic (with and without return) instructions executed on all compute units
    on the accelerator, per normalization unit.
  unit: ''
Global/Generic Instr:
  plain: The total number of global & generic memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of global & generic memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Global/Generic Instructions:
  plain: The total number of global & generic memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of global & generic memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Global/Generic Read:
  plain: The total number of global & generic memory read instructions executed on all compute units on the accelerator, per
    normalization unit.
  rst: The total number of global & generic memory read instructions executed on all compute units on the accelerator, per
    normalization unit.
  unit: ''
Global/Generic Read Instructions:
  plain: The total number of global & generic memory read instructions executed on all compute units on the accelerator, per
    normalization unit.
  rst: The total number of global & generic memory read instructions executed on all compute units on the accelerator, per
    normalization unit.
  unit: ''
Global/Generic Write:
  plain: The total number of global & generic memory write instructions executed on all compute units on the accelerator,
    per normalization unit.
  rst: The total number of global & generic memory write instructions executed on all compute units on the accelerator, per
    normalization unit.
  unit: ''
Global/Generic Write Instructions:
  plain: The total number of global & generic memory write instructions executed on all compute units on the accelerator,
    per normalization unit.
  rst: The total number of global & generic memory write instructions executed on all compute units on the accelerator, per
    normalization unit.
  unit: ''
Grid Size:
  plain: The total number of work-items (or, threads) launched as a part of the kernel dispatch. In HIP, this is equivalent
    to the total grid size multiplied by the total workgroup (or, block) size.
  rst: The total number of work-items (or, threads) launched as a part of the kernel dispatch. In HIP, this is equivalent
    to the total grid size multiplied by the total workgroup (or, block) size.
  unit: ''
HBM Bandwidth:
  plain: Maximum theoretical bandwidth of the accelerator's local high-bandwidth memory (HBM) per unit time. This value is
    calculated as the number of HBM channels multiplied by the HBM channel width multiplied by the HBM clock frequency.
  rst: Maximum theoretical bandwidth of the accelerator's local high-bandwidth memory (HBM) per unit time. This value is calculated
    as the number of HBM channels multiplied by the HBM channel width multiplied by the HBM clock frequency.
  unit: ''
HBM Rd:
  plain: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from the accelerator's local HBM, per
    normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from the accelerator's local HBM, per
    normalization unit.
  unit: ''
HBM Read:
  plain: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from the accelerator's local HBM, per
    normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from the accelerator's local HBM, per
    normalization unit.
  unit: ''
HBM Read Traffic:
  plain: The percent of read requests generated by the L2 cache that are routed to the accelerator's local high-bandwidth
    memory (HBM). This breakdown does not consider the size of the request (meaning that 32B and 64B requests are both counted
    as a single request), so this metric only approximates the percent of the L2-Fabric Read bandwidth directed to the local
    HBM.
  rst: The percent of read requests generated by the L2 cache that are routed to the accelerator's local high-bandwidth memory
    (HBM). This breakdown does not consider the size of the request (meaning that 32B and 64B requests are both counted as
    a single request), so this metric only approximates the percent of the L2-Fabric Read bandwidth directed to the local
    HBM.
  unit: ''
HBM Wr:
  plain: 'The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in the accelerator''s
    local HBM, per normalization unit. '
  rst: 'The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in the accelerator''s
    local HBM, per normalization unit. '
  unit: ''
HBM Write and Atomic:
  plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in the accelerator's
    local HBM, per normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in the accelerator's
    local HBM, per normalization unit.
  unit: ''
HBM Write and Atomic Traffic:
  plain: The percent of write and atomic requests generated by the L2 cache that are routed to the accelerator's local high-bandwidth
    memory (HBM). This breakdown does not consider the size of the request (meaning that 32B and 64B requests are both counted
    as a single request), so this metric only approximates the percent of the L2-Fabric Write and Atomic bandwidth directed
    to the local HBM. Note that on current CDNA accelerators, such as the MI2XX, requests are only considered atomic by Infinity
    Fabric if they are targeted at fine-grained memory allocations or uncached memory allocations.
  rst: The percent of write and atomic requests generated by the L2 cache that are routed to the accelerator's local high-bandwidth
    memory (HBM). This breakdown does not consider the size of the request (meaning that 32B and 64B requests are both counted
    as a single request), so this metric only approximates the percent of the L2-Fabric Write and Atomic bandwidth directed
    to the local HBM. Note that on current CDNA accelerators, such as the MI2XX, requests are only considered atomic by Infinity
    Fabric if they are targeted at fine-grained memory allocations or uncached memory allocations.
  unit: ''
Hit Rate:
  plain: The ratio of the number of L2 cache line requests that hit in the L2 cache over the total number of incoming cache
    line requests to the L2 cache.
  rst: The ratio of the number of L2 cache line requests that hit in the L2 cache over the total number of incoming cache
    line requests to the L2 cache.
  unit: ''
Hit Ratio:
  plain: The ratio of the number of translation requests that hit in the UTCL1 divided by the total number of translation
    requests made to the UTCL1.
  rst: The ratio of the number of translation requests that hit in the UTCL1 divided by the total number of translation requests
    made to the UTCL1.
  unit: ''
Hit rate:
  plain: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests
    to the vL1D Cache RAM.
  rst: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests
    to the vL1D Cache RAM.
  unit: ''
Hits:
  plain: The total number of requests to the L2 from all clients that hit in the cache. As noted in the Speed-of-Light section,
    this includes hit-on-miss requests.
  rst: The total number of requests to the L2 from all clients that hit in the cache. As noted in the Speed-of-Light section,
    this includes hit-on-miss requests.
  unit: ''
IL1 Fetch:
  plain: The total number of requests made to the L1I per normalization-unit.
  rst: The total number of requests made to the L1I per normalization-unit.
  unit: ''
IL1 Hit:
  plain: The percent of L1I requests that hit on a previously loaded line the cache. Calculated as the ratio of the number
    of L1I requests that hit over the number of all L1I requests.
  rst: The percent of L1I requests that hit on a previously loaded line the cache. Calculated as the ratio of the number of
    L1I requests that hit over the number of all L1I requests.
  unit: ''
IL1 Lat:
  plain: The average number of cycles spent to fetch instructions to a CU.
  rst: The average number of cycles spent to fetch instructions to a CU.
  unit: ''
IL1_L2 Rd:
  plain: The total number of requests across the L1I - L2 interface per normalization-unit.
  rst: The total number of requests across the L1I - L2 interface per normalization-unit.
  unit: ''
INT32:
  plain: The total number of instructions operating on 32-bit integer operands issued to the VALU per normalization unit.
  rst: The total number of instructions operating on 32-bit integer operands issued to the VALU per normalization unit.
  unit: ''
INT64:
  plain: The total number of instructions operating on 64-bit integer operands issued to the VALU per normalization unit.
  rst: The total number of instructions operating on 64-bit integer operands issued to the VALU per normalization unit.
  unit: ''
INT8 OPs:
  plain: The total number of 8-bit integer operations executed on either the VALU or MFMA units, per normalization unit.
  rst: The total number of 8-bit integer operations executed on either the VALU or MFMA units, per normalization unit.
  unit: ''
IOPs (Total):
  plain: The total number of integer operations executed on either the VALU or MFMA units, per normalization unit.
  rst: The total number of integer operations executed on either the VALU or MFMA units, per normalization unit.
  unit: ''
IPC:
  plain: The ratio of the total number of instructions executed on the CU over the total active CU cycles. This is also presented
    as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  rst: The ratio of the total number of instructions executed on the CU over the total active CU cycles. This is also presented
    as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  unit: ''
IPC (Issued):
  plain: The ratio of the total number of (non-internal) instructions issued over the number of cycles where the scheduler
    was actively working on issuing instructions.
  rst: The ratio of the total number of (non-internal) instructions issued over the number of cycles where the scheduler was
    actively working on issuing instructions.
  unit: ''
Index Accesses:
  plain: The total number of cycles spent in the LDS scheduler over all operations per normalization unit.
  rst: The total number of cycles spent in the LDS scheduler over all operations per normalization unit.
  unit: ''
Instruction Fetch Latency:
  plain: The average number of cycles spent to fetch instructions to a CU.
  rst: The average number of cycles spent to fetch instructions to a CU.
  unit: ''
Instructions per wavefront:
  plain: The average number of instructions (of all types) executed per wavefront. This is averaged over all wavefronts in
    a kernel dispatch.
  rst: The average number of instructions (of all types) executed per wavefront. This is averaged over all wavefronts in a
    kernel dispatch.
  unit: ''
Insufficient CU Barriers:
  plain: The percent of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to lack of available
    barriers.
  rst: The percent of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to lack of available
    barriers.
  unit: ''
Insufficient CU LDS:
  plain: The percent of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to lack of available
    LDS.
  rst: The percent of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to lack of available
    LDS.
  unit: ''
Insufficient SIMD SGPRs:
  plain: The percent of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of
    available SGPRs.
  rst: The percent of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of available
    SGPRs.
  unit: ''
Insufficient SIMD VGPRs:
  plain: The percent of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of
    available VGPRs.
  rst: The percent of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of available
    VGPRs.
  unit: ''
Insufficient SIMD Waveslots:
  plain: The percent of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of
    available waveslots.
  rst: The percent of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of available
    waveslots.
  unit: ''
Invalidations:
  plain: The number of times the vL1D was issued a write-back invalidate command during the kernel's execution per normalization
    unit. This may be triggered by, for instance, the buffer_wbinvl1 instruction.
  rst: The number of times the vL1D was issued a write-back invalidate command during the kernel's execution per normalization
    unit. This may be triggered by, for instance, the buffer_wbinvl1 instruction.
  unit: ''
Issue Wait Cycles:
  plain: The number of cycles a wavefront in the kernel dispatch was unable to issue an instruction for any reason (e.g.,
    execution pipe back-pressure, arbitration loss, etc.) per normalization unit. This counter is incremented at every cycle
    by all wavefronts on a CU unable to issue an instruction. As such, it is most useful to get a sense of how waves were
    spending their time, rather than identification of a precise limiter because another wave could be actively executing
    while a wave is issue stalled. The sum of this metric, Dependency Wait Cycles and Active Cycles should be equal to the
    total Wave Cycles metric.
  rst: The number of cycles a wavefront in the kernel dispatch was unable to issue an instruction for any reason (e.g., execution
    pipe back-pressure, arbitration loss, etc.) per normalization unit. This counter is incremented at every cycle by all
    wavefronts on a CU unable to issue an instruction. As such, it is most useful to get a sense of how waves were spending
    their time, rather than identification of a precise limiter because another wave could be actively executing while a wave
    is issue stalled. The sum of this metric, Dependency Wait Cycles and Active Cycles should be equal to the total Wave Cycles
    metric.
  unit: ''
Kernel Time:
  plain: The total duration of the executed kernel.
  rst: The total duration of the executed kernel.
  unit: ''
Kernel Time (Cycles):
  plain: The total duration of the executed kernel in cycles.
  rst: The total duration of the executed kernel in cycles.
  unit: ''
L1 Access Latency:
  plain: Calculated as the average number of cycles that a vL1D cache line request spent in the vL1D cache pipeline.
  rst: Calculated as the average number of cycles that a vL1D cache line request spent in the vL1D cache pipeline.
  unit: ''
L1 Cache Bandwidth:
  plain: The number of bytes looked up in the vL1D cache as a result of VMEM instructions per unit time. The number of bytes
    is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial
    requests, so e.g., if only a single value is requested in a cache line, the data movement will still be counted as a full
    cache line. The peak empirically measured bandwidth achievable on the specific accelerator is displayed alongside for
    comparison.
  rst: The number of bytes looked up in the vL1D cache as a result of VMEM instructions per unit time. The number of bytes
    is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial
    requests, so e.g., if only a single value is requested in a cache line, the data movement will still be counted as a full
    cache line. The peak empirically measured bandwidth achievable on the specific accelerator is displayed alongside for
    comparison.
  unit: ''
L1-L2 Atomic:
  plain: The number of atomic requests that are sent through the vL1D to the L2 cache, per normalization unit. This includes
    requests for atomics with, and without return.
  rst: The number of atomic requests that are sent through the vL1D to the L2 cache, per normalization unit. This includes
    requests for atomics with, and without return.
  unit: ''
L1-L2 BW:
  plain: The number of bytes transferred across the vL1D-L2 interface as a result of VMEM instructions, divided by total duration.
    The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size. This value
    does not consider partial requests, so for instance, if only a single value is requested in a cache line, the data movement
    will still be counted as a full cache line.
  rst: The number of bytes transferred across the vL1D-L2 interface as a result of VMEM instructions, divided by total duration.
    The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size. This value
    does not consider partial requests, so for instance, if only a single value is requested in a cache line, the data movement
    will still be counted as a full cache line.
  unit: ''
L1-L2 Read:
  plain: The number of read requests for a vL1D cache line that were not satisfied by the vL1D and must be retrieved from
    the to the L2 Cache per normalization unit.
  rst: The number of read requests for a vL1D cache line that were not satisfied by the vL1D and must be retrieved from the
    to the L2 Cache per normalization unit.
  unit: ''
L1-L2 Read Latency:
  plain: Calculated as the average number of cycles that the vL1D cache took to issue and receive read requests from the L2
    Cache. This number also includes requests for atomics with return values.
  rst: Calculated as the average number of cycles that the vL1D cache took to issue and receive read requests from the L2
    Cache. This number also includes requests for atomics with return values.
  unit: ''
L1-L2 Write:
  plain: The number of write requests to a vL1D cache line that were sent through the vL1D to the L2 cache, per normalization
    unit.
  rst: The number of write requests to a vL1D cache line that were sent through the vL1D to the L2 cache, per normalization
    unit.
  unit: ''
L1-L2 Write Latency:
  plain: Calculated as the average number of cycles that the vL1D cache took to issue and receive acknowledgement of a write
    request to the L2 Cache. This number also includes requests for atomics without return values.
  rst: Calculated as the average number of cycles that the vL1D cache took to issue and receive acknowledgement of a write
    request to the L2 Cache. This number also includes requests for atomics without return values.
  unit: ''
L1I BW:
  plain: The percent of L1I requests that hit on a previously loaded line the cache. Calculated as the ratio of the number
    of L1I requests that hit over the number of all L1I requests.
  rst: The percent of L1I requests that hit on a previously loaded line the cache. Calculated as the ratio of the number of
    L1I requests that hit over the number of all L1I requests.
  unit: ''
L1I Fetch Latency:
  plain: The average number of cycles spent to fetch instructions to a CU.
  rst: The average number of cycles spent to fetch instructions to a CU.
  unit: ''
L1I Hit Rate:
  plain: The number of bytes looked up in the L1I cache per unit time. This is also presented as a percent of the peak theoretical
    bandwidth achievable on the specific accelerator.
  rst: The number of bytes looked up in the L1I cache per unit time. This is also presented as a percent of the peak theoretical
    bandwidth achievable on the specific accelerator.
  unit: ''
L1I-L2 Bandwidth:
  plain: Total number of bytes transferred across L1I - L2 interface divided by total duration.
  rst: Total number of bytes transferred across L1I - L2 interface divided by total duration.
  unit: ''
L1I-L2 Bandwidth Utilization:
  plain: The percent of the peak theoretical L1I → L2 cache request bandwidth achieved. Calculated as the ratio of the total
    number of requests from the L1I to the L2 cache over the total L1I-L2 interface cycles.
  rst: The percent of the peak theoretical L1I → L2 cache request bandwidth achieved. Calculated as the ratio of the total
    number of requests from the L1I to the L2 cache over the total L1I-L2 interface cycles.
  unit: ''
L2 Atomic:
  plain: The total number of atomic requests (with and without return) to the L2 from all clients.
  rst: The total number of atomic requests (with and without return) to the L2 from all clients.
  unit: ''
L2 Cache BW:
  plain: The number of bytes looked up in the L2 cache per unit time. The number of bytes is calculated as the number of cache
    lines requested multiplied by the cache line size. This value does not consider partial requests, so e.g., if only a single
    value is requested in a cache line, the data movement will still be counted as a full cache line. This is also presented
    as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  rst: The number of bytes looked up in the L2 cache per unit time. The number of bytes is calculated as the number of cache
    lines requested multiplied by the cache line size. This value does not consider partial requests, so e.g., if only a single
    value is requested in a cache line, the data movement will still be counted as a full cache line. This is also presented
    as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  unit: ''
L2 Cache Bandwidth:
  plain: The number of bytes looked up in the L2 cache per unit time. The number of bytes is calculated as the number of cache
    lines requested multiplied by the cache line size. This value does not consider partial requests, so e.g., if only a single
    value is requested in a cache line, the data movement will still be counted as a full cache line. The peak empirically
    measured bandwidth achievable on the specific accelerator is displayed alongside for comparison.
  rst: The number of bytes looked up in the L2 cache per unit time. The number of bytes is calculated as the number of cache
    lines requested multiplied by the cache line size. This value does not consider partial requests, so e.g., if only a single
    value is requested in a cache line, the data movement will still be counted as a full cache line. The peak empirically
    measured bandwidth achievable on the specific accelerator is displayed alongside for comparison.
  unit: ''
L2 Cache Hit Rate:
  plain: The percent of total number of requests to the L2 from all clients that hit in the cache. As noted in the Speed-of-Light
    section, this includes hit-on-miss requests.
  rst: The percent of total number of requests to the L2 from all clients that hit in the cache. As noted in the Speed-of-Light
    section, this includes hit-on-miss requests.
  unit: ''
L2 Hit:
  plain: The ratio of the number of L2 cache line requests that hit in the L2 cache over the total number of incoming cache
    line requests to the L2 cache.
  rst: The ratio of the number of L2 cache line requests that hit in the L2 cache over the total number of incoming cache
    line requests to the L2 cache.
  unit: ''
L2 Rd:
  plain: The total number of read requests to the L2 from all clients.
  rst: The total number of read requests to the L2 from all clients.
  unit: ''
L2 Rd Lat:
  plain: Calculated as the average number of cycles that the vL1D cache took to issue and receive read requests from the L2
    Cache. This number also includes requests for atomics with return values.
  rst: Calculated as the average number of cycles that the vL1D cache took to issue and receive read requests from the L2
    Cache. This number also includes requests for atomics with return values.
  unit: ''
L2 Wr:
  plain: The total number of write requests to the L2 from all clients.
  rst: The total number of write requests to the L2 from all clients.
  unit: ''
L2 Wr Lat:
  plain: Calculated as the average number of cycles that the vL1D cache took to issue and receive acknowledgement of a write
    request to the L2 Cache. This number also includes requests for atomics without return values.
  rst: Calculated as the average number of cycles that the vL1D cache took to issue and receive acknowledgement of a write
    request to the L2 Cache. This number also includes requests for atomics without return values.
  unit: ''
L2-Fabric Read BW:
  plain: The number of bytes read by the L2 over the Infinity Fabric interface per unit time.
  rst: The number of bytes read by the L2 over the Infinity Fabric interface per unit time.
  unit: ''
L2-Fabric Read Latency:
  plain: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
  rst: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
  unit: ''
L2-Fabric Write BW:
  plain: The number of bytes sent by the L2 over the Infinity Fabric interface by write and atomic operations per unit time.
    This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  rst: The number of bytes sent by the L2 over the Infinity Fabric interface by write and atomic operations per unit time.
    This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  unit: ''
L2-Fabric Write Latency:
  plain: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was
    returned to the L2.
  rst: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was
    returned to the L2.
  unit: ''
L2-Fabric Write and Atomic BW:
  plain: The number of bytes sent by the L2 over the Infinity Fabric interface by write and atomic operations per unit time.
  rst: The number of bytes sent by the L2 over the Infinity Fabric interface by write and atomic operations per unit time.
  unit: ''
LDS:
  plain: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions)
    executed per normalization unit.
  rst: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions)
    executed per normalization unit.
  unit: ''
LDS Allocation:
  plain: 'The number of bytes of LDS memory (or, shared memory) allocated for this kernel. Note: This may also be larger than
    what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
  rst: 'The number of bytes of LDS memory (or, shared memory) allocated for this kernel. Note: This may also be larger than
    what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
  unit: ''
LDS Bandwidth:
  plain: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    per unit time (see LDS Bandwidth example for more detail). The peak empirically measured LDS bandwidth achievable on the
    specific accelerator is displayed alongside for comparison.
  rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    per unit time (see LDS Bandwidth example for more detail). The peak empirically measured LDS bandwidth achievable on the
    specific accelerator is displayed alongside for comparison.
  unit: ''
LDS Bank Conflicts/Access:
  plain: The ratio of the number of cycles spent in the LDS scheduler due to bank conflicts (as determined by the conflict
    resolution hardware) to the base number of cycles that would be spent in the LDS scheduler in a completely uncontended
    case. This is also presented in normalized form (i.e., the Bank Conflict Rate).
  rst: The ratio of the number of cycles spent in the LDS scheduler due to bank conflicts (as determined by the conflict resolution
    hardware) to the base number of cycles that would be spent in the LDS scheduler in a completely uncontended case. This
    is also presented in normalized form (i.e., the Bank Conflict Rate).
  unit: ''
LDS Instructions:
  plain: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions)
    executed per normalization unit.
  rst: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions)
    executed per normalization unit.
  unit: ''
LDS Latency:
  plain: The average number of round-trip cycles (i.e., from issue to data-return / acknowledgment) required for an LDS instruction
    to complete.
  rst: The average number of round-trip cycles (i.e., from issue to data-return / acknowledgment) required for an LDS instruction
    to complete.
  unit: ''
LDS Req:
  plain: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions)
    executed per normalization unit.
  rst: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions)
    executed per normalization unit.
  unit: ''
LDS Util:
  plain: Indicates what percent of the kernel's duration the LDS was actively executing instructions (including, but not limited
    to, load, store, atomic and HIP's __shfl operations). Calculated as the ratio of the total number of cycles LDS was active
    over the total CU cycles.
  rst: Indicates what percent of the kernel's duration the LDS was actively executing instructions (including, but not limited
    to, load, store, atomic and HIP's __shfl operations). Calculated as the ratio of the total number of cycles LDS was active
    over the total CU cycles.
  unit: ''
MFMA:
  plain: Total number of MFMA (Matrix-Fused-Multiply-Add) instructions issued per normalization unit.
  rst: Total number of MFMA (Matrix-Fused-Multiply-Add) instructions issued per normalization unit.
  unit: ''
MFMA FLOPs (BF16):
  plain: 'The total number of 16-bit brain floating point MFMA operations executed per second. Note: this does not include
    any 16-bit brain floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical
    BF16 MFMA operations achievable on the specific accelerator.'
  rst: 'The total number of 16-bit brain floating point MFMA operations executed per second. Note: this does not include any
    16-bit brain floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical
    BF16 MFMA operations achievable on the specific accelerator.'
  unit: ''
MFMA FLOPs (F16):
  plain: 'The total number of 16-bit floating point MFMA operations executed per second. Note: this does not include any 16-bit
    floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F16 MFMA
    operations achievable on the specific accelerator.'
  rst: 'The total number of 16-bit floating point MFMA operations executed per second. Note: this does not include any 16-bit
    floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F16 MFMA
    operations achievable on the specific accelerator.'
  unit: ''
MFMA FLOPs (F32):
  plain: 'The total number of 32-bit floating point MFMA operations executed per second. Note: this does not include any 32-bit
    floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F32 MFMA
    operations achievable on the specific accelerator.'
  rst: 'The total number of 32-bit floating point MFMA operations executed per second. Note: this does not include any 32-bit
    floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F32 MFMA
    operations achievable on the specific accelerator.'
  unit: ''
MFMA FLOPs (F64):
  plain: 'The total number of 64-bit floating point MFMA operations executed per second. Note: this does not include any 64-bit
    floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F64 MFMA
    operations achievable on the specific accelerator.'
  rst: 'The total number of 64-bit floating point MFMA operations executed per second. Note: this does not include any 64-bit
    floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F64 MFMA
    operations achievable on the specific accelerator.'
  unit: ''
MFMA FLOPs (F6F4):
  plain: 'The total number of 4-bit and 6-bit floating point MFMA operations executed per second. Note: this does not include
    any floating point operations from VALU instructions. The peak empirically measured F6F4 MFMA operations achievable on
    the specific accelerator is displayed alongside for comparison. It is supported on AMD Instinct MI350 series (gfx950)
    and later only.'
  rst: 'The total number of 4-bit and 6-bit floating point MFMA operations executed per second. Note: this does not include
    any floating point operations from VALU instructions. The peak empirically measured F6F4 MFMA operations achievable on
    the specific accelerator is displayed alongside for comparison. It is supported on AMD Instinct MI350 series (gfx950)
    and later only.'
  unit: ''
MFMA FLOPs (F8):
  plain: The total number of 8-bit brain floating point MFMA operations executed per second. This does not include any 16-bit
    brain floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F8
    MFMA operations achievable on the specific accelerator. It is supported on AMD Instinct MI300 series and later only.
  rst: The total number of 8-bit brain floating point MFMA operations executed per second. This does not include any 16-bit
    brain floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F8
    MFMA operations achievable on the specific accelerator. It is supported on AMD Instinct MI300 series and later only.
  unit: ''
MFMA IOPs (INT8):
  plain: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer
    operations from VALU instructions. This is also presented as a percent of the peak theoretical INT8 MFMA operations achievable
    on the specific accelerator.'
  rst: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer
    operations from VALU instructions. This is also presented as a percent of the peak theoretical INT8 MFMA operations achievable
    on the specific accelerator.'
  unit: ''
MFMA IOPs (Int8):
  plain: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer
    operations from VALU instructions. This is also presented as a percent of the peak theoretical INT8 MFMA operations achievable
    on the specific accelerator.'
  rst: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer
    operations from VALU instructions. This is also presented as a percent of the peak theoretical INT8 MFMA operations achievable
    on the specific accelerator.'
  unit: ''
MFMA Instruction Cycles:
  plain: The average duration of MFMA instructions in this kernel in cycles. Computed as the ratio of the total number of
    cycles the MFMA unit was busy over the total number of MFMA instructions.
  rst: The average duration of MFMA instructions in this kernel in cycles. Computed as the ratio of the total number of cycles
    the MFMA unit was busy over the total number of MFMA instructions.
  unit: ''
MFMA Utilization:
  plain: Indicates what percent of the kernel's duration the MFMA unit was busy executing instructions. Computed as the ratio
    of the total number of cycles the MFMA was busy over the total CU cycles.
  rst: Indicates what percent of the kernel's duration the MFMA unit was busy executing instructions. Computed as the ratio
    of the total number of cycles the MFMA was busy over the total CU cycles.
  unit: ''
MFMA-BF16:
  plain: The total number of 16-bit brain floating point MFMA instructions issued per normalization unit.
  rst: The total number of 16-bit brain floating point MFMA instructions issued per normalization unit.
  unit: ''
MFMA-F16:
  plain: The total number of 16-bit floating point MFMA instructions issued per normalization unit.
  rst: The total number of 16-bit floating point MFMA instructions issued per normalization unit.
  unit: ''
MFMA-F32:
  plain: The total number of 32-bit floating-point MFMA instructions issued per normalization unit.
  rst: The total number of 32-bit floating-point MFMA instructions issued per normalization unit.
  unit: ''
MFMA-F64:
  plain: The total number of 64-bit floating-point MFMA instructions issued per normalization unit.
  rst: The total number of 64-bit floating-point MFMA instructions issued per normalization unit.
  unit: ''
MFMA-F8:
  plain: The total number of 8-bit floating point MFMA instructions issued per normalization unit. This is supported in AMD
    Instinct MI300 series and later only.
  rst: The total number of 8-bit floating point MFMA instructions issued per normalization unit. This is supported in AMD
    Instinct MI300 series and later only.
  unit: ''
MFMA-I8:
  plain: The total number of 8-bit integer MFMA instructions issued per normalization unit.
  rst: The total number of 8-bit integer MFMA instructions issued per normalization unit.
  unit: ''
Mem Violations:
  plain: The total number of out-of-bounds accesses made to the LDS, per normalization unit. This is unused and expected to
    be zero in most configurations for modern CDNA™ accelerators.
  rst: The total number of out-of-bounds accesses made to the LDS, per normalization unit. This is unused and expected to
    be zero in most configurations for modern CDNA™ accelerators.
  unit: ''
Misses:
  plain: The total number of requests to the L2 from all clients that miss in the cache. As noted in the Speed-of-Light section,
    these do not include hit-on-miss requests.
  rst: The total number of requests to the L2 from all clients that miss in the cache. As noted in the Speed-of-Light section,
    these do not include hit-on-miss requests.
  unit: ''
Misses - Duplicated:
  plain: The total number of L1I requests that missed on a cache line that were already pending due to another request, per
    normalization-unit.
  rst: The total number of L1I requests that missed on a cache line that were already pending due to another request, per
    normalization-unit.
  unit: ''
Misses - Non Duplicated:
  plain: 'The total number of sL1D requests that missed on a cache line that was not already pending due to another request,
    per normalization unit. '
  rst: 'The total number of sL1D requests that missed on a cache line that was not already pending due to another request,
    per normalization unit. '
  unit: ''
Misses- Duplicated:
  plain: The total number of sL1D requests that missed on a cache line that was already pending due to another request, per
    normalization unit.
  rst: The total number of sL1D requests that missed on a cache line that was already pending due to another request, per
    normalization unit.
  unit: ''
NC - Atomic:
  plain: Total atomic requests with NC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total atomic requests with NC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
NC - Read:
  plain: Total read requests with NC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total read requests with NC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
NC - Write:
  plain: Total write requests with NC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total write requests with NC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
NC Req:
  plain: The total number of requests to the L2 to Not-hardware-Coherent (NC) memory allocations, per normalization unit.
  rst: The total number of requests to the L2 to Not-hardware-Coherent (NC) memory allocations, per normalization unit.
  unit: ''
Not-scheduled Rate (Scheduler-Pipe):
  plain: 'The percent of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to
    a bottleneck within the scheduler-pipes rather than a lack of a CU or SIMD with sufficient resources. '
  rst: 'The percent of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to a
    bottleneck within the scheduler-pipes rather than a lack of a CU or SIMD with sufficient resources. '
  unit: ''
Not-scheduled Rate (Workgroup Manager):
  plain: The percent of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to
    a bottleneck within the workgroup manager rather than a lack of a CU or SIMD with sufficient resources.
  rst: The percent of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to a
    bottleneck within the workgroup manager rather than a lack of a CU or SIMD with sufficient resources.
  unit: ''
Num CUs:
  plain: Total number of compute units (CUs) on the accelerator.
  rst: Total number of compute units (CUs) on the accelerator.
  unit: ''
Peak Bandwidth:
  plain: The number of bytes looked up in the L2 cache, as a percent of the peak theoretical bandwidth achievable on the specific
    accelerator. The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size.
    This value does not consider partial requests, so e.g., if only a single value is requested in a cache line, the data
    movement will still be counted as a full cache line.
  rst: The number of bytes looked up in the L2 cache, as a percent of the peak theoretical bandwidth achievable on the specific
    accelerator. The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size.
    This value does not consider partial requests, so e.g., if only a single value is requested in a cache line, the data
    movement will still be counted as a full cache line.
  unit: ''
Performance (GFLOPs):
  plain: The overall achieved performance, measured in GigaFLOPs per second (GFLOP/s). This is calculated as the sum of all
    VALU and MFMA floating-point operations divided by the total execution time. This value is used as the y-coordinate for
    the kernel's point on the Roofline plot.
  rst: The overall achieved performance, measured in GigaFLOPs per second (GFLOP/s). This is calculated as the sum of all
    VALU and MFMA floating-point operations divided by the total execution time. This value is used as the y-coordinate for
    the kernel's point on the Roofline plot.
  unit: ''
Permission Misses:
  plain: The total number of translation requests that missed in the UTCL1 due to a permission error, per normalization unit.
    This is unused and expected to be zero in most configurations for modern CDNA™ accelerators.
  rst: The total number of translation requests that missed in the UTCL1 due to a permission error, per normalization unit.
    This is unused and expected to be zero in most configurations for modern CDNA™ accelerators.
  unit: ''
Probe Req:
  plain: The number of coherence probe requests made to the L2 cache from outside the accelerator. On an MI2XX, probe requests
    may be generated by, for example, writes to fine-grained device memory or by writes to coarse-grained device memory.
  rst: The number of coherence probe requests made to the L2 cache from outside the accelerator. On an MI2XX, probe requests
    may be generated by, for example, writes to fine-grained device memory or by writes to coarse-grained device memory.
  unit: ''
RW - Atomic:
  plain: Total atomic requests with RW mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total atomic requests with RW mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
RW - Read:
  plain: Total read requests with RW mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total read requests with RW mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
RW - Write:
  plain: Total write requests with RW mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total write requests with RW mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
RW Req:
  plain: The total number of requests to the L2 that go to Read-Write coherent memory (RW) allocations.
  rst: The total number of requests to the L2 that go to Read-Write coherent memory (RW) allocations.
  unit: ''
Reached CU Wavefront Limit:
  plain: The percent of total CU cycles in the kernel where a wavefront could not be scheduled to a CU due to limits within
    the workgroup manager. This is expected to be always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
  rst: The percent of total CU cycles in the kernel where a wavefront could not be scheduled to a CU due to limits within
    the workgroup manager. This is expected to be always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
  unit: ''
Reached CU Workgroup Limit:
  plain: The percent of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to limits within
    the workgroup manager. This is expected to be always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
  rst: The percent of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to limits within
    the workgroup manager. This is expected to be always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
  unit: ''
Read (32B):
  plain: The total number of L2 requests to Infinity Fabric to read 32B of data from any memory location, per normalization
    unit.
  rst: The total number of L2 requests to Infinity Fabric to read 32B of data from any memory location, per normalization
    unit.
  unit: ''
Read (64B):
  plain: The total number of L2 requests to Infinity Fabric to read 64B of data from any memory location, per normalization
    unit.
  rst: The total number of L2 requests to Infinity Fabric to read 64B of data from any memory location, per normalization
    unit.
  unit: ''
Read (Uncached):
  plain: The total number of L2 requests to Infinity Fabric to read uncached data from any memory location, per normalization
    unit. 64B requests for uncached data are counted as two 32B uncached data requests.
  rst: The total number of L2 requests to Infinity Fabric to read uncached data from any memory location, per normalization
    unit. 64B requests for uncached data are counted as two 32B uncached data requests.
  unit: ''
Read - HBM Stall:
  plain: The number of cycles the L2-Fabric interface was stalled on read requests to the accelerator's local HBM as a percent
    of the total active L2 cycles.
  rst: The number of cycles the L2-Fabric interface was stalled on read requests to the accelerator's local HBM as a percent
    of the total active L2 cycles.
  unit: ''
Read - Infinity Fabric Stall:
  plain: The number of cycles the L2-Fabric interface was stalled on read requests to remote Infinity Fabric connected accelerators
    or CPUs as a percent of the total active L2 cycles.
  rst: The number of cycles the L2-Fabric interface was stalled on read requests to remote Infinity Fabric connected accelerators
    or CPUs as a percent of the total active L2 cycles.
  unit: ''
Read - PCIe Stall:
  plain: The number of cycles the L2-Fabric interface was stalled on read requests to remote PCIe connected accelerators or
    CPUs as a percent of the total active L2 cycles.
  rst: The number of cycles the L2-Fabric interface was stalled on read requests to remote PCIe connected accelerators or
    CPUs as a percent of the total active L2 cycles.
  unit: ''
Read BW:
  plain: The total number of bytes read by the L2 cache from Infinity Fabric divided by total duration.
  rst: The total number of bytes read by the L2 cache from Infinity Fabric divided by total duration.
  unit: ''
Read Bandwidth:
  plain: Total number of bytes looked up in the L2 cache for read requests, divided by total duration.
  rst: Total number of bytes looked up in the L2 cache for read requests, divided by total duration.
  unit: ''
Read Bandwidth - HBM:
  plain: Total number of bytes due to L2 read requests due to HBM traffic, divided by total duration.
  rst: Total number of bytes due to L2 read requests due to HBM traffic, divided by total duration.
  unit: ''
Read Bandwidth - Infinity Fabric™:
  plain: Total number of bytes due to L2 read requests due to Infinity Fabric traffic, divided by total duration.
  rst: Total number of bytes due to L2 read requests due to Infinity Fabric traffic, divided by total duration.
  unit: ''
Read Bandwidth - PCIe:
  plain: Total number of bytes due to L2 read requests due to PCIe traffic, divided by total duration.
  rst: Total number of bytes due to L2 read requests due to PCIe traffic, divided by total duration.
  unit: ''
Read Instructions:
  plain: The number of read instructions submitted to the data-return unit by the address processor summed over all compute
    units on the accelerator, per normalization unit. This is expected to be the sum of global/generic and spill/stack reads
    in the address processor.
  rst: The number of read instructions submitted to the data-return unit by the address processor summed over all compute
    units on the accelerator, per normalization unit. This is expected to be the sum of global/generic and spill/stack reads
    in the address processor.
  unit: ''
Read Latency:
  plain: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
  rst: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
  unit: ''
Read Req:
  plain: The total number of read requests to the L2 from all clients.
  rst: The total number of read requests to the L2 from all clients.
  unit: ''
Read Req (1 DWord):
  plain: The total number of sL1D read requests made for a single dword of data (4B), per normalization unit.
  rst: The total number of sL1D read requests made for a single dword of data (4B), per normalization unit.
  unit: ''
Read Req (16 DWord):
  plain: The total number of sL1D read requests made for a sixteen dwords of data (64B), per normalization unit.
  rst: The total number of sL1D read requests made for a sixteen dwords of data (64B), per normalization unit.
  unit: ''
Read Req (2 DWord):
  plain: The total number of sL1D read requests made for a two dwords of data (8B), per normalization unit.
  rst: The total number of sL1D read requests made for a two dwords of data (8B), per normalization unit.
  unit: ''
Read Req (4 DWord):
  plain: The total number of sL1D read requests made for a four dwords of data (16B), per normalization unit.
  rst: The total number of sL1D read requests made for a four dwords of data (16B), per normalization unit.
  unit: ''
Read Req (8 DWord):
  plain: The total number of sL1D read requests made for a eight dwords of data (32B), per normalization unit.
  rst: The total number of sL1D read requests made for a eight dwords of data (32B), per normalization unit.
  unit: ''
Read Req (Total):
  plain: The total number of sL1D read requests of any size, per normalization unit.
  rst: The total number of sL1D read requests of any size, per normalization unit.
  unit: ''
Read Stall:
  plain: The ratio of the total number of cycles the L2-Fabric interface was stalled on a read request to any destination
    (local HBM, remote PCIe® connected accelerator or CPU, or remote Infinity Fabric connected accelerator or CPU) over the
    total active L2 cycles.
  rst: The ratio of the total number of cycles the L2-Fabric interface was stalled on a read request to any destination (local
    HBM, remote PCIe® connected accelerator or CPU, or remote Infinity Fabric connected accelerator or CPU) over the total
    active L2 cycles.
  unit: ''
Remote Read:
  plain: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from any source other than the accelerator's
    local HBM, per normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from any source other than the accelerator's
    local HBM, per normalization unit.
  unit: ''
Remote Read Traffic:
  plain: The percent of read requests generated by the L2 cache that are routed to any memory location other than the accelerator's
    local high-bandwidth memory (HBM) - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does not
    consider the size of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric Read bandwidth directed to a remote location.
  rst: The percent of read requests generated by the L2 cache that are routed to any memory location other than the accelerator's
    local high-bandwidth memory (HBM) - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does not
    consider the size of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric Read bandwidth directed to a remote location.
  unit: ''
Remote Write and Atomic:
  plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in any memory
    location other than the accelerator's local HBM, per normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in any memory location
    other than the accelerator's local HBM, per normalization unit.
  unit: ''
Remote Write and Atomic Traffic:
  plain: The percent of read requests generated by the L2 cache that are routed to any memory location other than the accelerator's
    local high-bandwidth memory (HBM) - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does not
    consider the size of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric Read bandwidth directed to a remote location. Note that on current CDNA
    accelerators, such as the MI2XX, requests are only considered atomic by Infinity Fabric if they are targeted at fine-grained
    memory allocations or uncached memory allocations.
  rst: The percent of read requests generated by the L2 cache that are routed to any memory location other than the accelerator's
    local high-bandwidth memory (HBM) - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does not
    consider the size of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric Read bandwidth directed to a remote location. Note that on current CDNA
    accelerators, such as the MI2XX, requests are only considered atomic by Infinity Fabric if they are targeted at fine-grained
    memory allocations or uncached memory allocations.
  unit: ''
Req:
  plain: The total number of incoming requests to the L2 from all clients for all request types, per normalization unit.
  rst: The total number of incoming requests to the L2 from all clients for all request types, per normalization unit.
  unit: ''
Restored Wavefronts:
  plain: The total number of wavefronts restored from a context-save.
  rst: The total number of wavefronts restored from a context-save.
  unit: ''
SALU:
  plain: Total Number of SALU (Scalar ALU) instructions issued per normalization unit.
  rst: Total Number of SALU (Scalar ALU) instructions issued per normalization unit.
  unit: ''
SALU Utilization:
  plain: Indicates what percent of the kernel's duration the SALU was busy executing instructions. Computed as the ratio of
    the total number of cycles spent by the scheduler issuing SALU or SMEM instructions over the total CU cycles.
  rst: Indicates what percent of the kernel's duration the SALU was busy executing instructions. Computed as the ratio of
    the total number of cycles spent by the scheduler issuing SALU or SMEM instructions over the total CU cycles.
  unit: ''
SGPR:
  plain: 'The number of scalar general-purpose registers allocated for the kernel, see SALU. Note: this may not exactly match
    the number of SGPRs requested by the compiler due to allocation granularity.'
  rst: 'The number of scalar general-purpose registers allocated for the kernel, see SALU. Note: this may not exactly match
    the number of SGPRs requested by the compiler due to allocation granularity.'
  unit: ''
SGPR Writes:
  plain: The average number of cycles spent initializing SGPRs at wave creation.
  rst: The average number of cycles spent initializing SGPRs at wave creation.
  unit: ''
SGPRs:
  plain: 'The number of scalar general-purpose registers allocated for the kernel, see SALU. Note: this may not exactly match
    the number of SGPRs requested by the compiler due to allocation granularity.'
  rst: 'The number of scalar general-purpose registers allocated for the kernel, see SALU. Note: this may not exactly match
    the number of SGPRs requested by the compiler due to allocation granularity.'
  unit: ''
SIMD Utilization:
  plain: The percent of total SIMD cycles in the kernel where any SIMD on a CU was actively doing any work, summed over all
    CUs. Low values (less than 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance
    issue.
  rst: The percent of total SIMD cycles in the kernel where any SIMD on a CU was actively doing any work, summed over all
    CUs. Low values (less than 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance
    issue.
  unit: ''
SMEM:
  plain: Total number of SMEM (Scalar Memory Read) instructions issued normalization unit.
  rst: Total number of SMEM (Scalar Memory Read) instructions issued normalization unit.
  unit: ''
SMEM Latency:
  plain: The average number of round-trip cycles (that is, from issue to data return / acknowledgment) required for a SMEM
    instruction to complete.
  rst: The average number of round-trip cycles (that is, from issue to data return / acknowledgment) required for a SMEM instruction
    to complete.
  unit: ''
Saved Wavefronts:
  plain: The total number of wavefronts saved at a context-save.
  rst: The total number of wavefronts saved at a context-save.
  unit: ''
Scheduler-Pipe Stall Rate:
  plain: The percent of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to
    occupancy limitations (like a lack of a CU or SIMD with sufficient resources).
  rst: The percent of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to occupancy
    limitations (like a lack of a CU or SIMD with sufficient resources).
  unit: ''
Scheduler-Pipe Utilization:
  plain: The percent of total scheduler-pipe cycles in the kernel where the scheduler-pipes were actively doing any work.
  rst: The percent of total scheduler-pipe cycles in the kernel where the scheduler-pipes were actively doing any work.
  unit: ''
Scratch Allocation:
  plain: The number of bytes of scratch memory requested per work-item for this kernel. Scratch memory is used for stack memory
    on the accelerator, as well as for register spills and restores.
  rst: The number of bytes of scratch memory requested per work-item for this kernel. Scratch memory is used for stack memory
    on the accelerator, as well as for register spills and restores.
  unit: ''
Scratch Stall Rate:
  plain: The percent of total shader-engine cycles in the kernel where a workgroup could not be scheduled to a CU due to lack
    of private (a.k.a., scratch) memory slots. While this can reach up to 100%, note that the actual occupancy limitations
    on a kernel using private memory are typically quite small (for example, less than 1% of the total number of waves that
    can be scheduled to an accelerator).
  rst: The percent of total shader-engine cycles in the kernel where a workgroup could not be scheduled to a CU due to lack
    of private (a.k.a., scratch) memory slots. While this can reach up to 100%, note that the actual occupancy limitations
    on a kernel using private memory are typically quite small (for example, less than 1% of the total number of waves that
    can be scheduled to an accelerator).
  unit: ''
Shader Engine Utilization:
  plain: The percent of total shader engine cycles in the kernel where any CU in a shader-engine was actively doing any work,
    normalized over all shader-engines. Low values (e.g., << 100%) indicate that the accelerator was not fully saturated by
    the kernel, or a potential load-imbalance issue.
  rst: The percent of total shader engine cycles in the kernel where any CU in a shader-engine was actively doing any work,
    normalized over all shader-engines. Low values (e.g., << 100%) indicate that the accelerator was not fully saturated by
    the kernel, or a potential load-imbalance issue.
  unit: ''
Spill/Stack Atomic:
  plain: The total number of spill/stack memory atomic (with and without return) instructions executed on all compute units
    on the accelerator, per normalization unit. Typically unused as these memory operations are typically used to implement
    thread-local storage.
  rst: The total number of spill/stack memory atomic (with and without return) instructions executed on all compute units
    on the accelerator, per normalization unit. Typically unused as these memory operations are typically used to implement
    thread-local storage.
  unit: ''
Spill/Stack Atomic Instructions:
  plain: The total number of spill/stack memory atomic (with and without return) instructions executed on all compute units
    on the accelerator, per normalization unit. Typically unused as these memory operations are typically used to implement
    thread-local storage.
  rst: The total number of spill/stack memory atomic (with and without return) instructions executed on all compute units
    on the accelerator, per normalization unit. Typically unused as these memory operations are typically used to implement
    thread-local storage.
  unit: ''
Spill/Stack Coalesced Read:
  plain: The number of cycles the address processing unit spent working on coalesced spill/stack read instructions, per normalization
    unit.
  rst: The number of cycles the address processing unit spent working on coalesced spill/stack read instructions, per normalization
    unit.
  unit: ''
Spill/Stack Coalesced Write:
  plain: The number of cycles the address processing unit spent working on coalesced spill/stack write instructions, per normalization
    unit.
  rst: The number of cycles the address processing unit spent working on coalesced spill/stack write instructions, per normalization
    unit.
  unit: ''
Spill/Stack Instr:
  plain: The total number of spill/stack memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of spill/stack memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Spill/Stack Instructions:
  plain: The total number of spill/stack memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of spill/stack memory instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Spill/Stack Read:
  plain: The total number of spill/stack memory read instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of spill/stack memory read instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Spill/Stack Read Instructions:
  plain: The total number of spill/stack memory read instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of spill/stack memory read instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Spill/Stack Total Cycles:
  plain: The number of cycles the address processing unit spent working on spill/stack instructions, per normalization unit.
  rst: The number of cycles the address processing unit spent working on spill/stack instructions, per normalization unit.
  unit: ''
Spill/Stack Write:
  plain: The total number of spill/stack memory write instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of spill/stack memory write instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Spill/Stack Write Instructions:
  plain: The total number of spill/stack memory write instructions executed on all compute units on the accelerator, per normalization
    unit.
  rst: The total number of spill/stack memory write instructions executed on all compute units on the accelerator, per normalization
    unit.
  unit: ''
Stall Cycles:
  plain: The total number of cycles the sL1D↔L2 interface was stalled, per normalization unit.
  rst: The total number of cycles the sL1D↔L2 interface was stalled, per normalization unit.
  unit: ''
Stalled on L2 Data:
  plain: The ratio of the number of cycles where the vL1D is stalled waiting for requested data to return from the L2 cache
    divided by the number of cycles where the vL1D is active.
  rst: The ratio of the number of cycles where the vL1D is stalled waiting for requested data to return from the L2 cache
    divided by the number of cycles where the vL1D is active.
  unit: ''
Stalled on L2 Req:
  plain: The ratio of the number of cycles where the vL1D is stalled waiting to issue a request for data to the L2 cache divided
    by the number of cycles where the vL1D is active.
  rst: The ratio of the number of cycles where the vL1D is stalled waiting to issue a request for data to the L2 cache divided
    by the number of cycles where the vL1D is active.
  unit: ''
Streaming Req:
  plain: The total number of incoming requests to the L2 that are marked as streaming. The exact meaning of this may differ
    depending on the targeted accelerator, however on an MI2XX this corresponds to non-temporal load or stores. The L2 cache
    attempts to evict streaming requests before normal requests when the L2 is at capacity.
  rst: The total number of incoming requests to the L2 that are marked as streaming. The exact meaning of this may differ
    depending on the targeted accelerator, however on an MI2XX this corresponds to non-temporal load or stores. The L2 cache
    attempts to evict streaming requests before normal requests when the L2 is at capacity.
  unit: ''
Tag RAM Stall (Atomic):
  plain: The ratio of the number of cycles where the vL1D is stalled due to Atomic requests with conflicting tags being looked
    up concurrently, divided by the number of cycles where the vL1D is active.
  rst: The ratio of the number of cycles where the vL1D is stalled due to Atomic requests with conflicting tags being looked
    up concurrently, divided by the number of cycles where the vL1D is active.
  unit: ''
Tag RAM Stall (Read):
  plain: The ratio of the number of cycles where the vL1D is stalled due to Read requests with conflicting tags being looked
    up concurrently, divided by the number of cycles where the vL1D is active.
  rst: The ratio of the number of cycles where the vL1D is stalled due to Read requests with conflicting tags being looked
    up concurrently, divided by the number of cycles where the vL1D is active.
  unit: ''
Tag RAM Stall (Write):
  plain: The ratio of the number of cycles where the vL1D is stalled due to Write requests with conflicting tags being looked
    up concurrently, divided by the number of cycles where the vL1D is active.
  rst: The ratio of the number of cycles where the vL1D is stalled due to Write requests with conflicting tags being looked
    up concurrently, divided by the number of cycles where the vL1D is active.
  unit: ''
Theoretical Bandwidth:
  plain: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    divided by total duration. Does not take into account the execution mask of the wavefront when the instruction was executed.
  rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    divided by total duration. Does not take into account the execution mask of the wavefront when the instruction was executed.
  unit: ''
Theoretical Bandwidth Utilization:
  plain: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    divided as percentage of theoretical peak. Does not take into account the execution mask of the wavefront when the instruction
    was executed.
  rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    divided as percentage of theoretical peak. Does not take into account the execution mask of the wavefront when the instruction
    was executed.
  unit: ''
Theoretical LDS Bandwidth:
  plain: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    per unit time (see LDS Bandwidth example for more detail). This is also presented as a percent of the peak theoretical
    F64 MFMA operations achievable on the specific accelerator.
  rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS
    per unit time (see LDS Bandwidth example for more detail). This is also presented as a percent of the peak theoretical
    F64 MFMA operations achievable on the specific accelerator.
  unit: ''
Total Instructions:
  plain: The total number of memory instructions executed by the address processer over all compute units on the accelerator,
    per normalization unit.
  rst: The total number of memory instructions executed by the address processer over all compute units on the accelerator,
    per normalization unit.
  unit: ''
Total Req:
  plain: The total number of incoming requests from the address processing unit after coalescing.
  rst: The total number of incoming requests from the address processing unit after coalescing.
  unit: ''
Total Wavefronts:
  plain: The total number of wavefronts launched as part of the kernel dispatch. On AMD Instinct™ CDNA™ accelerators and GCN™
    GPUs, the wavefront size is always 64 work-items. Thus, the total number of wavefronts should be equivalent to the ceiling
    of grid size divided by 64.
  rst: The total number of wavefronts launched as part of the kernel dispatch. On AMD Instinct™ CDNA™ accelerators and GCN™
    GPUs, the wavefront size is always 64 work-items. Thus, the total number of wavefronts should be equivalent to the ceiling
    of grid size divided by 64.
  unit: ''
Translation Misses:
  plain: The total number of translation requests that missed in the UTCL1 due to  translation not being present in the cache,
    per normalization unit.
  rst: The total number of translation requests that missed in the UTCL1 due to  translation not being present in the cache,
    per normalization unit.
  unit: ''
UC - Atomic:
  plain: Total atomic requests with UC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total atomic requests with UC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
UC - Read:
  plain: Total read requests with UC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total read requests with UC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
UC - Write:
  plain: Total write requests with UC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  rst: Total write requests with UC mtype from this TCP to all TCCs Sum over TCP instances per normalization unit.
  unit: ''
UC Req:
  plain: The total number of requests to the L2 that go to Uncached (UC) memory allocations.
  rst: The total number of requests to the L2 that go to Uncached (UC) memory allocations.
  unit: ''
Unaligned Stall:
  plain: The total number of cycles spent in the LDS scheduler due to stalls from non-dword aligned addresses per normalization
    unit.
  rst: The total number of cycles spent in the LDS scheduler due to stalls from non-dword aligned addresses per normalization
    unit.
  unit: ''
Uncached Read Traffic:
  plain: The percent of read requests generated by the L2 cache that are reading from an uncached memory allocation. Note,
    as described in the request flow section, a single 64B read request is typically counted as two uncached read requests.
    So, it is possible for the Uncached Read Traffic to reach up to 200% of the total number of read requests. This breakdown
    does not consider the size of the request (i.e., 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric read bandwidth directed to an uncached memory location.
  rst: The percent of read requests generated by the L2 cache that are reading from an uncached memory allocation. Note, as
    described in the request flow section, a single 64B read request is typically counted as two uncached read requests. So,
    it is possible for the Uncached Read Traffic to reach up to 200% of the total number of read requests. This breakdown
    does not consider the size of the request (i.e., 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric read bandwidth directed to an uncached memory location.
  unit: ''
Uncached Write and Atomic Traffic:
  plain: The percent of write and atomic requests generated by the L2 cache that are targeting uncached memory allocations.
    This breakdown does not consider the size of the request (meaning that 32B and 64B requests are both counted as a single
    request), so this metric only approximates the percent of the L2-Fabric read bandwidth directed to uncached memory allocations.
  rst: The percent of write and atomic requests generated by the L2 cache that are targeting uncached memory allocations.
    This breakdown does not consider the size of the request (meaning that 32B and 64B requests are both counted as a single
    request), so this metric only approximates the percent of the L2-Fabric read bandwidth directed to uncached memory allocations.
  unit: ''
Utilization:
  plain: The ratio of the number of cycles an L2 channel was active, summed over all L2 channels on the accelerator over the
    total L2 cycles.
  rst: The ratio of the number of cycles an L2 channel was active, summed over all L2 channels on the accelerator over the
    total L2 cycles.
  unit: ''
VALU:
  plain: The number of VALU (Vector ALU) instructions issued per normalization unit.
  rst: The number of VALU (Vector ALU) instructions issued per normalization unit.
  unit: ''
VALU Active Threads:
  plain: Indicates the average level of divergence within a wavefront over the lifetime of the kernel. The number of work-items
    that were active in a wavefront during execution of each VALU instruction, time-averaged over all VALU instructions run
    on all wavefronts in the kernel.
  rst: Indicates the average level of divergence within a wavefront over the lifetime of the kernel. The number of work-items
    that were active in a wavefront during execution of each VALU instruction, time-averaged over all VALU instructions run
    on all wavefronts in the kernel.
  unit: ''
VALU FLOPs:
  plain: 'The total floating-point operations executed per second on the VALU. This is also presented as a percent of the
    peak theoretical FLOPs achievable on the specific accelerator. Note: this does not include any floating-point operations
    from MFMA instructions.'
  rst: 'The total floating-point operations executed per second on the VALU. This is also presented as a percent of the peak
    theoretical FLOPs achievable on the specific accelerator. Note: this does not include any floating-point operations from
    MFMA instructions.'
  unit: ''
VALU FLOPs (F16):
  plain: 'The total 16-bit floating-point operations executed per second on the VALU. This is presented with the value of
    the peak empirical F16 FLOPs achievable on the specific accelerator. Note: this does not include any F16 operations from
    MFMA instructions.'
  rst: 'The total 16-bit floating-point operations executed per second on the VALU. This is presented with the value of the
    peak empirical F16 FLOPs achievable on the specific accelerator. Note: this does not include any F16 operations from MFMA
    instructions.'
  unit: ''
VALU FLOPs (F32):
  plain: 'The total 32-bit floating-point operations executed per second on the VALU. This is presented with the value of
    the peak empirical F32 FLOPs achievable on the specific accelerator. Note: this does not include any F32 operations from
    MFMA instructions.'
  rst: 'The total 32-bit floating-point operations executed per second on the VALU. This is presented with the value of the
    peak empirical F32 FLOPs achievable on the specific accelerator. Note: this does not include any F32 operations from MFMA
    instructions.'
  unit: ''
VALU FLOPs (F64):
  plain: 'The total 64-bit floating-point operations executed per second on the VALU. This is presented with the value of
    the peak empirical F64 FLOPs achievable on the specific accelerator. Note: this does not include any F64 operations from
    MFMA instructions.'
  rst: 'The total 64-bit floating-point operations executed per second on the VALU. This is presented with the value of the
    peak empirical F64 FLOPs achievable on the specific accelerator. Note: this does not include any F64 operations from MFMA
    instructions.'
  unit: ''
VALU IOPs:
  plain: 'The total integer operations executed per second on the VALU. This is also presented as a percent of the peak theoretical
    IOPs achievable on the specific accelerator. Note: this does not include any integer operations from MFMA instructions.'
  rst: 'The total integer operations executed per second on the VALU. This is also presented as a percent of the peak theoretical
    IOPs achievable on the specific accelerator. Note: this does not include any integer operations from MFMA instructions.'
  unit: ''
VALU Utilization:
  plain: Indicates what percent of the kernel's duration the VALU was busy executing instructions. Does not include VMEM operations.
    Computed as the ratio of the total number of cycles spent by the scheduler issuing VALU instructions over the total CU
    cycles.
  rst: Indicates what percent of the kernel's duration the VALU was busy executing instructions. Does not include VMEM operations.
    Computed as the ratio of the total number of cycles spent by the scheduler issuing VALU instructions over the total CU
    cycles.
  unit: ''
VGPR:
  plain: 'The number of architected vector general-purpose registers allocated for the kernel, see VALU. Note: this may not
    exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
  rst: 'The number of architected vector general-purpose registers allocated for the kernel, see VALU. Note: this may not
    exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
  unit: ''
VGPR Writes:
  plain: The average number of cycles spent initializing VGPRs at wave creation.
  rst: The average number of cycles spent initializing VGPRs at wave creation.
  unit: ''
VGPRs:
  plain: 'The number of architected vector general-purpose registers allocated for the kernel, see VALU. Note: this may not
    exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
  rst: 'The number of architected vector general-purpose registers allocated for the kernel, see VALU. Note: this may not
    exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
  unit: ''
VL1 Atomic:
  plain: The total number of incoming atomic requests from the address processing unit after coalescing per normalization
    unit
  rst: The total number of incoming atomic requests from the address processing unit after coalescing per normalization unit
  unit: ''
VL1 Coalesce:
  plain: Indicates how well memory instructions were coalesced by the address processing unit, ranging from uncoalesced (25%)
    to fully coalesced (100%). Calculated as the average number of thread-requests generated per instruction divided by the
    ideal number of thread-requests per instruction.
  rst: Indicates how well memory instructions were coalesced by the address processing unit, ranging from uncoalesced (25%)
    to fully coalesced (100%). Calculated as the average number of thread-requests generated per instruction divided by the
    ideal number of thread-requests per instruction.
  unit: ''
VL1 Hit:
  plain: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests
    to the vL1D Cache RAM.
  rst: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests
    to the vL1D Cache RAM.
  unit: ''
VL1 Lat:
  plain: Calculated as the average number of cycles that a vL1D cache line request spent in the vL1D cache pipeline.
  rst: Calculated as the average number of cycles that a vL1D cache line request spent in the vL1D cache pipeline.
  unit: ''
VL1 Rd:
  plain: The total number of incoming read requests from the address processing unit after coalescing per normalization unit
  rst: The total number of incoming read requests from the address processing unit after coalescing per normalization unit
  unit: ''
VL1 Stall:
  plain: The ratio of the number of cycles where the vL1D is stalled waiting to issue a request for data to the L2 cache divided
    by the number of cycles where the vL1D is active.
  rst: The ratio of the number of cycles where the vL1D is stalled waiting to issue a request for data to the L2 cache divided
    by the number of cycles where the vL1D is active.
  unit: ''
VL1 Wr:
  plain: The total number of incoming write requests from the address processing unit after coalescing per normalization unit
  rst: The total number of incoming write requests from the address processing unit after coalescing per normalization unit
  unit: ''
VL1_L2 Atomic:
  plain: The number of atomic requests that are sent through the vL1D to the L2 cache, per normalization unit. This includes
    requests for atomics with, and without return.
  rst: The number of atomic requests that are sent through the vL1D to the L2 cache, per normalization unit. This includes
    requests for atomics with, and without return.
  unit: ''
VL1_L2 Rd:
  plain: The number of read requests for a vL1D cache line that were not satisfied by the vL1D and must be retrieved from
    the to the L2 Cache per normalization unit.
  rst: The number of read requests for a vL1D cache line that were not satisfied by the vL1D and must be retrieved from the
    to the L2 Cache per normalization unit.
  unit: ''
VL1_L2 Wr:
  plain: The number of write requests to a vL1D cache line that were sent through the vL1D to the L2 cache, per normalization
    unit.
  rst: The number of write requests to a vL1D cache line that were sent through the vL1D to the L2 cache, per normalization
    unit.
  unit: ''
VMEM:
  plain: The number of VMEM (GPU Memory) read instructions issued (including FLAT/scratch memory) per normalization unit.
  rst: The number of VMEM (GPU Memory) read instructions issued (including FLAT/scratch memory) per normalization unit.
  unit: ''
VMEM Latency:
  plain: The average number of round-trip cycles (that is, from issue to data return / acknowledgment) required for a VMEM
    instruction to complete.
  rst: The average number of round-trip cycles (that is, from issue to data return / acknowledgment) required for a VMEM instruction
    to complete.
  unit: ''
VMEM Utilization:
  plain: Indicates what percent of the kernel's duration the VMEM unit was busy executing instructions, including both global/generic
    and spill/scratch operations (see the VMEM instruction count metrics) for more detail). Does not include VALU operations.
    Computed as the ratio of the total number of cycles spent by the scheduler issuing VMEM instructions over the total CU
    cycles.
  rst: Indicates what percent of the kernel's duration the VMEM unit was busy executing instructions, including both global/generic
    and spill/scratch operations (see the VMEM instruction count metrics) for more detail). Does not include VALU operations.
    Computed as the ratio of the total number of cycles spent by the scheduler issuing VMEM instructions over the total CU
    cycles.
  unit: ''
Wave Cycles:
  plain: The number of cycles a wavefront in the kernel dispatch spent resident on a compute unit per normalization unit.
    This is averaged over all wavefronts in a kernel dispatch.
  rst: The number of cycles a wavefront in the kernel dispatch spent resident on a compute unit per normalization unit. This
    is averaged over all wavefronts in a kernel dispatch.
  unit: ''
Wave Life:
  plain: Average number of cycles executing a wave.
  rst: Average number of cycles executing a wave.
  unit: ''
Wavefront Occupancy:
  plain: 'The time-averaged number of wavefronts resident on the accelerator over the lifetime of the kernel. Note: this metric
    may be inaccurate for short-running kernels (less than 1ms). This is also presented as a percent of the peak theoretical
    occupancy achievable on the specific accelerator.'
  rst: 'The time-averaged number of wavefronts resident on the accelerator over the lifetime of the kernel. Note: this metric
    may be inaccurate for short-running kernels (less than 1ms). This is also presented as a percent of the peak theoretical
    occupancy achievable on the specific accelerator.'
  unit: ''
Wavefronts:
  plain: The total number of wavefronts, summed over all workgroups, forming this kernel launch.
  rst: The total number of wavefronts, summed over all workgroups, forming this kernel launch.
  unit: ''
Workgroup Manager Utilization:
  plain: The percent of cycles in the kernel where the workgroup manager was actively doing any work.
  rst: The percent of cycles in the kernel where the workgroup manager was actively doing any work.
  unit: ''
Workgroup Size:
  plain: The total number of work-items (or, threads) in each workgroup (or, block) launched as part of the kernel dispatch.
    In HIP, this is equivalent to the total block size.
  rst: The total number of work-items (or, threads) in each workgroup (or, block) launched as part of the kernel dispatch.
    In HIP, this is equivalent to the total block size.
  unit: ''
Workgroup manager → Data-Return Stall:
  plain: Percent of the total CU cycles the data-return unit was stalled by the workgroup manager due to initialization of
    registers as a part of launching new workgroups.
  rst: Percent of the total CU cycles the data-return unit was stalled by the workgroup manager due to initialization of registers
    as a part of launching new workgroups.
  unit: ''
Workgroups:
  plain: The total number of workgroups forming this kernel launch.
  rst: The total number of workgroups forming this kernel launch.
  unit: ''
Write - Credit Starvation:
  plain: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to any memory location because
    too many write/atomic requests were currently in flight, as a percent of the total active L2 cycles.
  rst: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to any memory location because
    too many write/atomic requests were currently in flight, as a percent of the total active L2 cycles.
  unit: ''
Write - HBM Stall:
  plain: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to accelerator's local HBM as
    a percent of the total active L2 cycles.
  rst: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to accelerator's local HBM as
    a percent of the total active L2 cycles.
  unit: ''
Write - Infinity Fabric Stall:
  plain: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to remote Infinity Fabric connected
    accelerators or CPUs as a percent of the total active L2 cycles.
  rst: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to remote Infinity Fabric connected
    accelerators or CPUs as a percent of the total active L2 cycles.
  unit: ''
Write - PCIe Stall:
  plain: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to remote PCIe connected accelerators
    or CPUs as a percent of the total active L2 cycles.
  rst: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to remote PCIe connected accelerators
    or CPUs as a percent of the total active L2 cycles.
  unit: ''
Write Ack Instructions:
  plain: The total number of write acknowledgements submitted by data-return unit to SQ, summed over all compute units on
    the accelerator, per normalization unit.
  rst: The total number of write acknowledgements submitted by data-return unit to SQ, summed over all compute units on the
    accelerator, per normalization unit.
  unit: ''
Write Bandwidth:
  plain: Total number of bytes looked up in the L2 cache for write requests, divided by total duration.
  rst: Total number of bytes looked up in the L2 cache for write requests, divided by total duration.
  unit: ''
Write Bandwidth - HBM:
  plain: Total number of bytes due to L2 write requests due to HBM traffic, divided by total duration.
  rst: Total number of bytes due to L2 write requests due to HBM traffic, divided by total duration.
  unit: ''
Write Bandwidth - Infinity Fabric™:
  plain: Total number of bytes due to L2 write requests due to Infinity Fabric traffic, divided by total duration.
  rst: Total number of bytes due to L2 write requests due to Infinity Fabric traffic, divided by total duration.
  unit: ''
Write Bandwidth - PCIe:
  plain: Total number of bytes due to L2 write requests due to PCIe traffic, divided by total duration.
  rst: Total number of bytes due to L2 write requests due to PCIe traffic, divided by total duration.
  unit: ''
Write Instructions:
  plain: The number of store instructions submitted to the data-return unit by the address processor summed over all compute
    units on the accelerator, per normalization unit. This is expected to be the sum of global/generic and spill/stack stores
    in the address processor.
  rst: The number of store instructions submitted to the data-return unit by the address processor summed over all compute
    units on the accelerator, per normalization unit. This is expected to be the sum of global/generic and spill/stack stores
    in the address processor.
  unit: ''
Write Req:
  plain: The total number of write requests to the L2 from all clients.
  rst: The total number of write requests to the L2 from all clients.
  unit: ''
Write Stall:
  plain: The ratio of the total number of cycles the L2-Fabric interface was stalled on a write or atomic request to any destination
    (local HBM, remote accelerator or CPU, PCIe connected accelerator or CPU, or remote Infinity Fabric connected accelerator
    or CPU) over the total active L2 cycles.
  rst: The ratio of the total number of cycles the L2-Fabric interface was stalled on a write or atomic request to any destination
    (local HBM, remote accelerator or CPU, PCIe connected accelerator or CPU, or remote Infinity Fabric connected accelerator
    or CPU) over the total active L2 cycles.
  unit: ''
Write and Atomic (32B):
  plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B of data to any memory location,
    per normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B of data to any memory location,
    per normalization unit.
  unit: ''
Write and Atomic (64B):
  plain: The total number of L2 requests to Infinity Fabric to write or atomically update 64B of data in any memory location,
    per normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to write or atomically update 64B of data in any memory location,
    per normalization unit.
  unit: ''
Write and Atomic (Uncached):
  plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of uncached data, per
    normalization unit.
  rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of uncached data, per normalization
    unit.
  unit: ''
Write and Atomic BW:
  plain: The total number of bytes written by the L2 over Infinity Fabric by write and atomic operations divided by total
    duration. Note that on current CDNA accelerators, such as the MI2XX, requests are only considered atomic by Infinity Fabric
    if they are targeted at non-write-cacheable memory, for example, fine-grained memory allocations or uncached memory allocations
    on the MI2XX.
  rst: The total number of bytes written by the L2 over Infinity Fabric by write and atomic operations divided by total duration.
    Note that on current CDNA accelerators, such as the MI2XX, requests are only considered atomic by Infinity Fabric if they
    are targeted at non-write-cacheable memory, for example, fine-grained memory allocations or uncached memory allocations
    on the MI2XX.
  unit: ''
Write and Atomic Latency:
  plain: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was
    returned to the L2.
  rst: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was
    returned to the L2.
  unit: ''
Writeback:
  plain: The total number of L2 cache lines written back to memory for any reason. Write-backs may occur due to user code
    (such as HIP kernel calls to _threadfence_system or atomic built-ins) by the command processor's memory acquire/release
    fences, or for other internal hardware reasons.
  rst: The total number of L2 cache lines written back to memory for any reason. Write-backs may occur due to user code (such
    as HIP kernel calls to _threadfence_system or atomic built-ins) by the command processor's memory acquire/release fences,
    or for other internal hardware reasons.
  unit: ''
Writeback (Internal):
  plain: The total number of L2 cache lines written back to memory for internal hardware reasons, per normalization unit.
  rst: The total number of L2 cache lines written back to memory for internal hardware reasons, per normalization unit.
  unit: ''
Writeback (vL1D Req):
  plain: The total number of L2 cache lines written back to memory due to requests initiated by the vL1D cache, per normalization
    unit.
  rst: The total number of L2 cache lines written back to memory due to requests initiated by the vL1D cache, per normalization
    unit.
  unit: ''
sL1D Cache BW:
  plain: The number of bytes looked up in the sL1D cache per unit time. This is also presented as a percent of the peak theoretical
    bandwidth achievable on the specific accelerator.
  rst: The number of bytes looked up in the sL1D cache per unit time. This is also presented as a percent of the peak theoretical
    bandwidth achievable on the specific accelerator.
  unit: ''
sL1D Cache Hit Rate:
  plain: The percent of sL1D requests that hit on a previously loaded line the cache. Calculated as the ratio of the number
    of sL1D requests that hit over the number of all sL1D requests.
  rst: The percent of sL1D requests that hit on a previously loaded line the cache. Calculated as the ratio of the number
    of sL1D requests that hit over the number of all sL1D requests.
  unit: ''
sL1D Hit:
  plain: The total number of sL1D requests that hit on a previously loaded cache line, per normalization unit.
  rst: The total number of sL1D requests that hit on a previously loaded cache line, per normalization unit.
  unit: ''
sL1D Rd:
  plain: The total number of requests, of any size or type, made to the sL1D per normalization unit.
  rst: The total number of requests, of any size or type, made to the sL1D per normalization unit.
  unit: ''
sL1D-L2 BW:
  plain: The total number of bytes read from, written to, or atomically updated across the sL1D↔L2 interface, divided by total
    duration. Note that sL1D writes and atomics are typically unused on current CDNA accelerators, so in the majority of cases
    this can be interpreted as an sL1D→L2 read bandwidth.
  rst: The total number of bytes read from, written to, or atomically updated across the sL1D↔L2 interface, divided by total
    duration. Note that sL1D writes and atomics are typically unused on current CDNA accelerators, so in the majority of cases
    this can be interpreted as an sL1D→L2 read bandwidth.
  unit: ''
sL1D-L2 BW Utilization:
  plain: The percentage of the peak theoretical sL1D - L2 interface bandwidth acheived.\ \ Caclulated as total number of bytes
    read from, written to, or atomically updated\ \ across the sL1D - L2 interface.
  rst: The percentage of the peak theoretical sL1D - L2 interface bandwidth acheived.\ \ Caclulated as total number of bytes
    read from, written to, or atomically updated\ \ across the sL1D - L2 interface.
  unit: ''
sL1D_L2 Atomic:
  plain: The total number of atomic requests from sL1D to the L2, per normalization unit. Typically unused on current CDNA
    accelerators.
  rst: The total number of atomic requests from sL1D to the L2, per normalization unit. Typically unused on current CDNA accelerators.
  unit: ''
sL1D_L2 Rd:
  plain: The total number of read requests from sL1D to the L2, per normalization unit.
  rst: The total number of read requests from sL1D to the L2, per normalization unit.
  unit: ''
sL1D_L2 Wr:
  plain: The total number of write requests from sL1D to the L2, per normalization unit. Typically unused on current CDNA
    accelerators.
  rst: The total number of write requests from sL1D to the L2, per normalization unit. Typically unused on current CDNA accelerators.
  unit: ''
vL1D Cache BW:
  plain: The number of bytes looked up in the vL1D cache as a result of VMEM instructions per unit time. The number of bytes
    is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial
    requests, so e.g., if only a single value is requested in a cache line, the data movement will still be counted as a full
    cache line. This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  rst: The number of bytes looked up in the vL1D cache as a result of VMEM instructions per unit time. The number of bytes
    is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial
    requests, so e.g., if only a single value is requested in a cache line, the data movement will still be counted as a full
    cache line. This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  unit: ''
vL1D Cache Hit Rate:
  plain: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests
    to the vL1D cache RAM.
  rst: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests
    to the vL1D cache RAM.
  unit: ''
