    metric_overrides:
      L2 Cache Hit Rate:
        value: AVG(((((((((((((((((100 * TCC_HIT[0]) + (100 * TCC_HIT[1])) + (100 * TCC_HIT[2])) + (100 * TCC_HIT[3])) + (100
          * TCC_HIT[4])) + (100 * TCC_HIT[5])) + (100 * TCC_HIT[6])) + (100 * TCC_HIT[7])) + (100 * TCC_HIT[8])) + (100 *
          TCC_HIT[9])) + (100 * TCC_HIT[10])) + (100 * TCC_HIT[11])) + (100 * TCC_HIT[12])) + (100 * TCC_HIT[13])) + (100
          * TCC_HIT[14])) + (100 * TCC_HIT[15])) / (((((((((((((((((TCC_MISS[0] + TCC_HIT[0]) + (TCC_MISS[1] + TCC_HIT[1]))
          + (TCC_MISS[2] + TCC_HIT[2])) + (TCC_MISS[3] + TCC_HIT[3])) + (TCC_MISS[4] + TCC_HIT[4])) + (TCC_MISS[5] + TCC_HIT[5]))
          + (TCC_MISS[6] + TCC_HIT[6])) + (TCC_MISS[7] + TCC_HIT[7])) + (TCC_MISS[8] + TCC_HIT[8])) + (TCC_MISS[9] + TCC_HIT[9]))
          + (TCC_MISS[10] + TCC_HIT[10])) + (TCC_MISS[11] + TCC_HIT[11])) + (TCC_MISS[12] + TCC_HIT[12])) + (TCC_MISS[13]
          + TCC_HIT[13])) + (TCC_MISS[14] + TCC_HIT[14])) + (TCC_MISS[15] + TCC_HIT[15]))) if (((((((((((((((((TCC_MISS[0]
          + TCC_HIT[0]) + (TCC_MISS[1] + TCC_HIT[1])) + (TCC_MISS[2] + TCC_HIT[2])) + (TCC_MISS[3] + TCC_HIT[3])) + (TCC_MISS[4]
          + TCC_HIT[4])) + (TCC_MISS[5] + TCC_HIT[5])) + (TCC_MISS[6] + TCC_HIT[6])) + (TCC_MISS[7] + TCC_HIT[7])) + (TCC_MISS[8]
          + TCC_HIT[8])) + (TCC_MISS[9] + TCC_HIT[9])) + (TCC_MISS[10] + TCC_HIT[10])) + (TCC_MISS[11] + TCC_HIT[11])) + (TCC_MISS[12]
          + TCC_HIT[12])) + (TCC_MISS[13] + TCC_HIT[13])) + (TCC_MISS[14] + TCC_HIT[14])) + (TCC_MISS[15] + TCC_HIT[15]))
          != 0) else None)
        unit: pct
      Utilization:
        value: AVG(((100 * SQ_LDS_IDX_ACTIVE) / ($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)))
        unit: Pct of Peak
      L2-Fabric Read BW:
        value: AVG((((TCC_EA0_RDREQ_32B_sum * 32) + ((TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64)) / (End_Timestamp -
          Start_Timestamp)))
        unit: GB/s
      HBM Bandwidth:
        value: AVG((( (TCC_BUBBLE_sum * 128) + (TCC_EA0_RDREQ_32B_sum * 32) + ((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum)
          * 64) + ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32) + (TCC_EA0_WRREQ_64B_sum * 64)) / ((End_Timestamp - Start_Timestamp)
          / 1e9)) / 1e9)
        unit: GB/s
      Remote Read Traffic:
        value: AVG((100 * (MAX((TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_DRAM_sum), 0) / TCC_EA0_RDREQ_sum) if (TCC_EA0_RDREQ_sum
          != 0) else None))
        unit: pct
      Req:
        value: AVG((SQC_ICACHE_REQ / $denom))
        unit: (Req  + $normUnit)
      Read Req:
        value: AVG((SQC_TC_DATA_READ_REQ / $denom))
        unit: (Req  + $normUnit)
      Write Req:
        value: AVG((SQC_TC_DATA_WRITE_REQ / $denom))
        unit: (Req  + $normUnit)
      Atomic Req:
        value: AVG((SQC_TC_DATA_ATOMIC_REQ / $denom))
        unit: (Req  + $normUnit)
      Hits:
        value: AVG((SQC_ICACHE_HITS / $denom))
        unit: (Hits  + $normUnit)
      MFMA FLOPs (F8):
        value: AVG((((SQ_INSTS_VALU_MFMA_MOPS_F8 * 512)) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
        unit: GFLOP/s
        peak: $MFMAF8Flops_empirical_peak
      MFMA FLOPs (BF16):
        value: AVG((((SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512)) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
        unit: GFLOP/s
        peak: $MFMABF16Flops_empirical_peak
      MFMA FLOPs (F16):
        value: AVG((((SQ_INSTS_VALU_MFMA_MOPS_F16 * 512)) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
        unit: GFLOP/s
        peak: $MFMAF16Flops_empirical_peak
      MFMA FLOPs (F32):
        value: AVG((((SQ_INSTS_VALU_MFMA_MOPS_F32 * 512)) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
        unit: GFLOP/s
        peak: $MFMAF32Flops_empirical_peak
      MFMA FLOPs (F64):
        value: AVG((((SQ_INSTS_VALU_MFMA_MOPS_F64 * 512)) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
        unit: GFLOP/s
        peak: $MFMAF64Flops_empirical_peak
      MFMA IOPs (Int8):
        value: AVG(((SQ_INSTS_VALU_MFMA_MOPS_I8 * 512) / (End_Timestamp - Start_Timestamp)))
        unit: GIOP/s
        peak: ((($max_sclk * $cu_per_gpu) * 4096) / 1000)
      SALU Utilization:
        value: AVG((((100 * SQ_ACTIVE_INST_SCA) / $GRBM_GUI_ACTIVE_PER_XCD) / $cu_per_gpu))
        unit: pct
      VALU Utilization:
        value: AVG((((100 * SQ_ACTIVE_INST_VALU) / $GRBM_GUI_ACTIVE_PER_XCD) / $cu_per_gpu))
        unit: pct
      MFMA Utilization:
        value: AVG(((100 * SQ_VALU_MFMA_BUSY_CYCLES) / ((4 * $cu_per_gpu) * $GRBM_GUI_ACTIVE_PER_XCD)))
        unit: pct
      Wavefront Occupancy:
        value: ROUND(AVG((SQ_ACCUM_PREV_HIRES / $GRBM_GUI_ACTIVE_PER_XCD) / $numActiveCUs), 0)
        unit: Wavefronts
      SALU:
        value: AVG((SQ_INSTS_SALU / $denom))
        unit: (instr + $normUnit)
      SMEM:
        value: AVG((SQ_INSTS_SMEM / $denom))
        unit: (instr + $normUnit)
      VALU:
        value: AVG(((SQ_INSTS_VALU - SQ_INSTS_MFMA) / $denom))
        unit: (instr + $normUnit)
      MFMA:
        value: AVG((SQ_INSTS_MFMA / $denom))
        unit: (instr + $normUnit)
      VMEM:
        value: AVG(((SQ_INSTS_VMEM) / $denom))
        unit: (instr + $normUnit)
      LDS:
        value: AVG((SQ_INSTS_LDS / $denom))
        unit: (instr + $normUnit)
      LDS Allocation:
        value: AVG(LDS_Per_Workgroup)
        unit: Bytes
      Scratch Allocation:
        value: AVG(Scratch_Per_Workitem)
        unit: Bytes/Workitem
      LDS Latency:
        value: AVG(((SQ_ACCUM_PREV_HIRES / SQ_INSTS_LDS) if (SQ_INSTS_LDS != 0) else None))
        unit: Cycles
      AI L2:
        value: ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16)
          + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64
          + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16
          * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64
          * 512) + ) / SUM( (TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum
          + TCP_TCC_READ_REQ_sum) * 64 ) )
        unit: FLOPs/Byte
      AI L1:
        value: ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16)
          + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64
          + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16
          * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64
          * 512) + ) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum * 64) )
        unit: FLOPs/Byte
      Bandwidth Utilization:
        value: AVG(((SQC_ICACHE_REQ * 100000) / (($max_sclk * $sqc_per_gpu) * (End_Timestamp - Start_Timestamp))))
        unit: Pct of Peak
      Cache Hit Rate:
        value: AVG(((100 * SQC_ICACHE_HITS) / ((SQC_ICACHE_HITS + SQC_ICACHE_MISSES) + SQC_ICACHE_MISSES_DUPLICATE)))
        unit: pct
      Misses - Non Duplicated:
        value: AVG((SQC_ICACHE_MISSES / $denom))
        unit: (Misses  + $normUnit)
